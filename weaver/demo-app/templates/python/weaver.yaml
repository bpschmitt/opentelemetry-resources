# Python codegen target for `weaver registry generate`. Modeled on the Rust
# templates in open-telemetry/opentelemetry-weaver-examples (basic/templates/registry/rust),
# adapted for Python: `#` line comments, SCREAMING_SNAKE_CASE module-level
# string constants instead of `pub const ... : &str`.
whitespace_control:
  trim_blocks: true
  lstrip_blocks: true

comment_formats:
  python:
    format: markdown
    prefix: "# "
    trim: true
    remove_trailing_dots: true
default_comment_format: python

params:
  excluded_attributes: []

templates:
  - template: attributes.py.j2
    filter: semconv_grouped_attributes($params)
    application_mode: single
  - template: metrics.py.j2
    filter: semconv_grouped_metrics($params)
    application_mode: single
  - template: events.py.j2
    filter: semconv_grouped_events($params)
    application_mode: single
  - template: spans.py.j2
    filter: semconv_grouped_spans($params)
    application_mode: single
